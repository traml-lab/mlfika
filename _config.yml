
# Set this to the path your site is served from on GitHub Pages.
# For a project page (e.g. https://<org>.github.io/ml-fika) use "/ml-fika".
# For local preview run: jekyll serve --baseurl ""
baseurl: "https://traml-lab.github.io/mlfika"
color-scheme: "#004791" # KTH blue. Any HEX code works, e.g. "#00aa55".

sass:
  sass_dir: /assets/css/_sass
  style: compressed

include:
  - _pages

exclude:
  - .sass-cache

title: "Machine Learning Fika"
description: "Machine Learning Seminar Series at KTH"

information: "**Machine Learning Fika** (ML Fika) is a seminar series at KTH Royal Institute of Technology featuring invited talks across the field of machine learning research. It is jointly organised by Martin Trapp and Hossein Azizpour at the School of Electrical Engineering and Computer Science (EECS). This seminar series provides a platform for young researchers (PhD students or post-doc level) to give invited talks about their research."

# Link to the registration / signup form. Leave empty to show "Registration closed".
registration: "https://forms.gle/jaoYhpxJS6TrHPMk9"

# Link to the "Expression of Interest to Present" form for prospective speakers.
# Leave empty to hide the link.
interest_form: "https://forms.gle/S8XnyJXZJtBWBaeS6"

details: "Each session features an invited talk (30 min + 15 min Q&A) **live over Zoom & physically at CLS/RPL**, preceded by an introduction to the field. The talks will not be recorded unless the speaker separately requests it. The schedule is in Central European (Summer) Time. The seminar series starts after the summer break — so check back soon for the schedule."

scope: "**The scope of the seminar series** ranges from _generative models_, _statistical machine learning_, and _machine learning theory_ to applications in _drug discovery_, _computer vision_, and _robotics_."

organizers: "[Martin Trapp](https://trappmartin.github.io) and [Hossein Azizpour](https://www.kth.se/profile/azizpour)"

# Previous / related seminar series, listed at the bottom of the page.
related:
  - name: "Machine Learning Seminars at KTH (CVAP/CVG)"
    note: "previously organised by Hossein Azizpour"
    url: "https://www.csc.kth.se/cvap/cvg/ml-seminars/"
  - name: "Advances in Probabilistic Machine Learning (APML)"
    note: "Aalto University & ELLIS previously organised by Martin Trapp"
    url: "https://aaltoml.github.io/apml/"
